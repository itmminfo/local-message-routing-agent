name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest

      - name: Audit runtime and dev dependencies (pip-audit)
        run: pip-audit -r requirements.lock -r requirements-dev.lock

      - name: Static security analysis (bandit)
        run: bandit -r app scripts

      - name: Validate Compose config
        run: docker compose config -q

      - name: Build image (verifies the hashed lockfile installs)
        run: docker build -t local-message-routing-agent:ci .

      - name: Check runtime image contains only application inputs
        run: >-
          docker run --rm --entrypoint sh local-message-routing-agent:ci -c
          'test -f /app/app/main.py && test -f /app/scripts/e2e_mail_check.py &&
          test -f /app/scripts/adversarial_eval.py &&
          test -f /app/scripts/data/adversarial_pairs_v1.json &&
          test ! -e /app/tests && test ! -e /app/README.md &&
          test ! -e /app/SECURITY.md && test ! -e /app/.env'

      - name: Generate SBOM (Syft) for the built image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local-message-routing-agent:ci

  e2e-compose:
    # Proves the full container pipeline end to end (api -> Ollama tool call ->
    # Mailpit, with /ready gating and correct headers) without pulling a multi-GB
    # model: docker-compose.ci.yml swaps Ollama for a deterministic mock. This is a
    # plumbing proof, not a model-accuracy check (accuracy: docs/eval.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate CI Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q

      - name: Start the stack (mocked Ollama)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Run the E2E delivery + routing check
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.ci.yml
          run --rm tools scripts/e2e_mail_check.py

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
