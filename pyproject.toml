# Tooling configuration only. Dependencies live in requirements*.txt and are pinned
# with hashes in requirements*.lock, which the Dockerfile and CI install from.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# FastAPI uses `Depends(...)` as an argument default by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
strict = true
plugins = ["pydantic.mypy"]
